<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0d0a">
  <title>Olive Vintage Gallery — Secure Checkout</title>
  <link rel="icon" href="./assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./checkout.css">
</head>
<body>
  <main class="checkout-shell">
    <a class="brand" href="./index.html"><img src="./assets/olive-brand.jpg" alt=""><span>OLIVE VINTAGE GALLERY</span></a>
    <section class="checkout-card" aria-live="polite">
      <div id="checkoutSpinner" class="checkout-spinner" aria-hidden="true"></div>
      <p id="checkoutEyebrow" class="eyebrow">SECURE CHECKOUT</p>
      <h1 id="checkoutTitle">Confirming your acquisition…</h1>
      <p id="checkoutMessage">Please keep this page open while Square confirms your payment with Olive Vintage Gallery.</p>
      <div id="checkoutReceipt" class="receipt hidden"></div>
      <div class="checkout-actions">
        <a id="returnGallery" class="primary hidden" href="./index.html#collection">Return to the Gallery</a>
        <a id="contactGallery" class="secondary hidden" href="mailto:Olivejewelvintage@gmail.com">Contact the Gallery</a>
      </div>
    </section>
    <p class="secure-note">Payment is processed by Square. Olive Vintage Gallery does not store your card credentials.</p>
  </main>
  <script type="module" src="./checkout.js"></script>
</body>
</html>
