<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Olive Vintage Gallery — Listing Readiness</title><link rel="stylesheet" href="./admin.css"><link rel="stylesheet" href="./readiness.css"></head>
<body><header class="topbar"><div><div class="eyebrow">OLIVE VINTAGE GALLERY</div><h1>Listing Readiness</h1></div><div class="top-actions"><a class="ghost ready-link" href="./dashboard.html">Dashboard</a><a class="ghost ready-link" href="./admin.html">Inventory</a><span id="sessionEmail" class="muted"></span><button id="signOutBtn" class="ghost hidden">Sign out</button></div></header>
<main class="shell readiness-shell"><section id="loginPanel" class="panel login-panel"><div class="eyebrow">PRIVATE OWNER ACCESS</div><h2>Owner sign in</h2><form id="loginForm" class="stack"><label>Email<input id="loginEmail" type="email" required autocomplete="email"></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label><button class="primary">Open readiness report</button><p id="loginMessage" class="message"></p></form></section>
<section id="appPanel" class="hidden"><section class="panel readiness-hero"><div><div class="eyebrow">ACTIVE INVENTORY CHECK</div><h2>Know exactly what still needs attention.</h2><p>Only available listings are included. Inquiry-only pieces can be ready without a price or shipping package.</p></div><button id="refreshBtn" class="ghost">Refresh report</button></section><div id="readinessStats" class="readiness-stats"></div><section class="panel readiness-toolbar"><label>Show<select id="issueFilter"><option value="">All active listings</option><option value="ready">Ready to sell</option><option value="photos">Missing photos</option><option value="price">Missing price</option><option value="category">Missing category</option><option value="description">Missing description</option><option value="shipping">Missing shipping</option></select></label><label class="ready-search">Search<input id="searchInput" type="search" placeholder="Title, maker or inventory #…"></label><span id="resultCount" aria-live="polite"></span></section><div id="readinessList" class="readiness-list"></div></section></main><script type="module" src="./readiness.js"></script></body></html>
